<VirtualHost *:8080>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # WordPress is installed by the container entrypoint before Apache starts. The web installer and the
    # wp-config.php generator are never served, so nobody who reaches this port can install or reconfigure it.
    <Directory /var/www/html/wp-admin>
        <Files "install.php">
            Require all denied
        </Files>
        <Files "setup-config.php">
            Require all denied
        </Files>
    </Directory>
    # Uploaded files are data, never code: PHP is not executed under wp-content/uploads. php_admin_flag cannot be
    # changed by an .htaccess file, so a handler remapped there (AddType/SetHandler) still runs no PHP; the
    # LocationMatch is merged after .htaccess files, so one written there cannot grant access to a .php file again.
    # .htaccess files keep working otherwise (plugins protect their own upload folders with deny rules).
    <Directory /var/www/html/wp-content/uploads>
        php_admin_flag engine off
        <FilesMatch "\.(?i:php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <LocationMatch "^/wp-content/uploads/.*\.(?i:php[0-9]?|phtml|phar)(/|$)">
        Require all denied
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
