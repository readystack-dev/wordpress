# PHP files are handled by PHP and preferred over any other index file, and /var/www accepts .htaccess
# overrides: the Apache settings of the official php:apache image (its docker-php.conf).
<FilesMatch \.php$>
	SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex disabled
DirectoryIndex index.php index.html

<Directory /var/www/>
	Options -Indexes
	AllowOverride All
</Directory>
