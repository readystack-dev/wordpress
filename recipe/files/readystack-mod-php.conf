# ReadyStack: only .php files run as PHP, as on the official php:apache image this product's Debian
# releases ran on (Ubuntu's default also runs .phtml and .phar). The handler and DirectoryIndex are in
# /etc/apache2/conf-available/readystack-php.conf.
<FilesMatch ".+\.phps$">
    Require all denied
</FilesMatch>
<FilesMatch "^\.ph(?:ar|p|ps|tml)$">
    Require all denied
</FilesMatch>
